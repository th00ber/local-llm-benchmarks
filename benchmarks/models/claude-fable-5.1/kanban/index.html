<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Kanban board</title>
    <!-- Inline icon: three columns of a board (no extra request, no 404) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1117'/%3E%3Crect x='6' y='7' width='5' height='18' rx='2' fill='%238b9cff'/%3E%3Crect x='13.5' y='7' width='5' height='12' rx='2' fill='%235cc8e6'/%3E%3Crect x='21' y='7' width='5' height='8' rx='2' fill='%235fd98f'/%3E%3C/svg%3E"
    />

    <!-- Apply the saved theme before first paint to avoid a dark/light flash -->
    <script>
      try {
        if (localStorage.getItem('kanban.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>

    <!-- Inter from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This Kanban board needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
